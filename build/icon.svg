<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D2D3F"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#EE5A24"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="8" y="8" width="240" height="240" rx="56" ry="56" fill="url(#bg)"/>

  <!-- 漫画页面主体 — 白色矩形代表书页 -->
  <rect x="52" y="38" width="152" height="180" rx="12" ry="12" fill="#F0F0F5"/>

  <!-- 页面折角 -->
  <polygon points="204,38 204,72 170,38" fill="#DCDCE4"/>

  <!-- 左页面板格 — 漫画分镜线条 -->
  <rect x="68" y="56" width="120" height="60" rx="4" ry="4" fill="none" stroke="#C4C4CF" stroke-width="3"/>
  <line x1="68" y1="80" x2="188" y2="80" stroke="#C4C4CF" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 右页面板格 -->
  <rect x="68" y="130" width="120" height="70" rx="4" ry="4" fill="none" stroke="#C4C4CF" stroke-width="3"/>

  <!-- 对话气泡 -->
  <path d="M88,104 Q78,94 88,88 L124,88 L124,88 Q134,78 144,88" fill="none" stroke="#C4C4CF" stroke-width="3" stroke-linecap="round"/>
  <path d="M112,104 L112,112 Q112,116 108,114 L100,110" fill="none" stroke="#C4C4CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Koma 标识 — 右下角渐变圆 -->
  <circle cx="200" cy="202" r="28" fill="url(#accent)"/>
  <!-- K 字母 -->
  <text x="200" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="white">K</text>
</svg>
